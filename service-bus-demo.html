<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How a Service Bus Works</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#0B1220;
  --panel:#131B2E;
  --panel-2:#0E1626;
  --line:#26314A;
  --line-soft:#1B2438;
  --text:#E8ECF4;
  --text-muted:#8B95AC;
  --cyan:#4DD8C4;
  --cyan-soft:rgba(77,216,196,0.14);
  --amber:#F5A623;
  --amber-soft:rgba(245,166,35,0.14);
  --red:#E5626A;
  --red-soft:rgba(229,98,106,0.14);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  padding:28px 20px 60px;
}
.app{max-width:1120px;margin:0 auto;}

/* header */
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--cyan);
  margin:0 0 10px;
}
h1{
  font-family:var(--font-display);
  font-size:clamp(24px,4vw,34px);
  font-weight:700;
  margin:0 0 6px;
  letter-spacing:-0.01em;
}
.subtitle{
  color:var(--text-muted);
  font-size:14.5px;
  margin:0 0 22px;
  max-width:620px;
}

/* tabs */
.tabs{
  display:flex;
  gap:4px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.tab-btn{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.03em;
  padding:11px 16px;
  color:var(--text-muted);
  background:transparent;
  border:none;
  border-bottom:2px solid transparent;
  cursor:pointer;
  transition:color .15s ease, border-color .15s ease;
}
.tab-btn .n{color:var(--line-soft);margin-right:6px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan);}
.tab-btn.active .n{color:var(--cyan);opacity:0.55;}
.tab-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

/* stage */
.stage{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:16px;
  margin-top:20px;
}
@media (max-width:840px){
  .stage{grid-template-columns:1fr;}
}
.canvas-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 18px 6px;
  position:relative;
  min-height:420px;
  display:flex;
  flex-direction:column;
}
.canvas-panel svg{width:100%;height:auto;display:block;}
.log-panel{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  font-family:var(--font-mono);
  font-size:11.5px;
  line-height:1.65;
  overflow-y:auto;
  max-height:460px;
  min-height:200px;
}
.log-empty{color:var(--text-muted);font-style:normal;opacity:0.6;}
.log-line{border-bottom:1px solid var(--line-soft);padding:5px 0;word-break:break-word;}
.log-line:last-child{border-bottom:none;}
.log-time{color:var(--text-muted);margin-right:8px;}
.log-ok{color:var(--cyan);}
.log-warn{color:var(--amber);}
.log-err{color:var(--red);}
.log-dim{color:var(--text-muted);}

/* stat row (tab 1) */
.stat-row{
  display:flex;
  align-items:baseline;
  gap:14px;
  font-family:var(--font-mono);
  margin-bottom:6px;
  flex-wrap:wrap;
}
.stat-num{font-size:30px;font-weight:600;color:var(--cyan);}
.stat-label{font-size:11.5px;color:var(--text-muted);}
.stat-arrow{color:var(--line-soft);font-size:20px;}

/* controls */
.controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:14px 0 16px;
  margin-top:auto;
  border-top:1px solid var(--line-soft);
}
.hint{
  font-size:12px;
  color:var(--text-muted);
  margin-right:4px;
}
.seg{
  display:inline-flex;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.seg button{
  font-family:var(--font-mono);
  font-size:11.5px;
  padding:8px 13px;
  background:transparent;
  border:none;
  color:var(--text-muted);
  cursor:pointer;
}
.seg button.active{background:var(--cyan-soft);color:var(--cyan);}
.seg button:not(:last-child){border-right:1px solid var(--line);}
button.btn{
  font-family:var(--font-body);
  font-size:13px;
  font-weight:600;
  padding:8px 15px;
  border-radius:8px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  cursor:pointer;
  transition:background .15s ease, opacity .15s ease;
}
button.btn.primary{background:var(--cyan);color:var(--ink);border-color:var(--cyan);}
button.btn.primary:hover{opacity:0.88;}
button.btn.ghost:hover{background:var(--line-soft);}
button.btn:disabled{opacity:0.35;cursor:not-allowed;}
button.btn:focus-visible, .seg button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.counter-chip{
  font-family:var(--font-mono);
  font-size:11.5px;
  color:var(--red);
  background:var(--red-soft);
  border:1px solid rgba(229,98,106,0.35);
  padding:6px 11px;
  border-radius:7px;
}

/* legend */
.legend{
  display:flex;
  gap:16px;
  font-size:11px;
  color:var(--text-muted);
  flex-wrap:wrap;
  margin:2px 0 12px;
}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* svg elements */
.node-circle{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5;cursor:pointer;transition:stroke .15s ease, stroke-width .15s ease;}
.node-circle.flash-warn{fill:var(--amber-soft);}
.node-circle.flash-ok{fill:var(--cyan-soft);}
.node-group:hover .node-circle{stroke:var(--text-muted);}
.node-label{fill:var(--text-muted);font-family:var(--font-mono);font-size:11px;text-anchor:middle;}
.node-tag{fill:var(--cyan);font-family:var(--font-mono);font-size:9.5px;text-anchor:middle;letter-spacing:0.06em;}
.hub-circle{fill:var(--cyan-soft);stroke:var(--cyan);stroke-width:2;}
.hub-label{fill:var(--cyan);font-family:var(--font-mono);font-weight:600;font-size:11px;text-anchor:middle;letter-spacing:0.05em;}
.conn-line{stroke:var(--line);stroke-width:1.3;}
.dlq-rect{fill:var(--panel-2);stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;}
.dlq-label{fill:var(--red);font-family:var(--font-mono);font-size:10.5px;text-anchor:middle;}
.filter-chip{fill:var(--text-muted);font-family:var(--font-mono);font-size:9px;text-anchor:middle;}

/* dlq inspector */
.dlq-header{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
.dlq-title{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);}
.dlq-list{display:flex;flex-direction:column;gap:8px;padding:12px 0;max-height:320px;overflow-y:auto;}
.dlq-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;flex-wrap:wrap;}
.dlq-row-title{font-family:var(--font-mono);font-size:12.5px;color:var(--text);}
.dlq-row-reason{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.dlq-row-actions{display:flex;gap:8px;flex-shrink:0;}
button.btn.small{padding:6px 11px;font-size:12px;}
.dlq-count{fill:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-anchor:middle;}

/* azure tab */
.azure-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 0 18px;}
@media (max-width:600px){.azure-grid{grid-template-columns:1fr;}}
.azure-card{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
}
.azure-card .from{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.05em;
  margin-bottom:4px;
}
.azure-card .to{
  font-family:var(--font-display);
  font-size:16.5px;
  font-weight:600;
  color:var(--cyan);
  margin-bottom:7px;
}
.azure-card p{font-size:12.5px;color:var(--text-muted);line-height:1.55;margin:0;}
.azure-note{
  font-size:13px;
  color:var(--text-muted);
  border-top:1px solid var(--line-soft);
  padding-top:14px;
  margin-top:4px;
  line-height:1.6;
}
.azure-note strong{color:var(--text);}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:0.01ms !important;}
}
</style>
</head>
<body>
<div class="app">
  <p class="eyebrow">Interactive walkthrough · Service bus mechanics</p>
  <h1>How a service bus actually works</h1>
  <p class="subtitle">Click through the four stages below. Each one builds on the last — from why we bother, to how a message moves, to what happens when a consumer breaks.</p>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="why"><span class="n">01</span>Why</button>
    <button class="tab-btn" data-tab="move"><span class="n">02</span>How it moves</button>
    <button class="tab-btn" data-tab="fail"><span class="n">03</span>When it fails</button>
    <button class="tab-btn" data-tab="azure"><span class="n">04</span>Meet Azure Service Bus</button>
  </div>

  <div class="stage">
    <div class="canvas-panel" id="canvasPanel"></div>
    <div class="log-panel" id="logPanel" aria-live="polite"></div>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const CX = 400, CY = 200, RING_R = 148, NODE_R = 30, HUB_R = 40;
const DLQ = {x:400, y:412};
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const SERVICES8 = ['Payments','Orders','Inventory','Notify','Ledger','Fraud Chk','Shipping','Audit'];
const SERVICES5 = ['Payments','Orders','Inventory','Notify','Ledger'];
const FULL5 = ['Payments API','Orders Service','Inventory Service','Notifications Service','Ledger Service'];

const FILTERS = ['all','all','standard','all','high']; // by SERVICES5 index: Payments, Orders, Inventory, Notify, Ledger
let dlqIdCounter = 0;

const state = {
  tab:'why',
  mode1:'p2p', count1:5,
  busMode2:'bus', deliveryMode2:'broadcast', msgTag:'standard', producer:0, rr:0,
  unhealthy:new Set(), dlqMessages:[], dlqView:false,
};

const canvasPanel = document.getElementById('canvasPanel');
const logPanel = document.getElementById('logPanel');

function pos(cx,cy,r,i,n){
  const a = (i/n)*Math.PI*2 - Math.PI/2;
  return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)};
}
function fmtTime(){
  const d = new Date(), p = x=>String(x).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function clearLog(){ logPanel.innerHTML = '<div class="log-empty">// waiting for activity…</div>'; }
function log(html, cls){
  if (logPanel.querySelector('.log-empty')) logPanel.innerHTML = '';
  const line = document.createElement('div');
  line.className = 'log-line' + (cls ? ' '+cls : '');
  line.innerHTML = `<span class="log-time">${fmtTime()}</span>${html}`;
  logPanel.appendChild(line);
  logPanel.scrollTop = logPanel.scrollHeight;
  while (logPanel.children.length > 80) logPanel.removeChild(logPanel.firstChild);
}

/* ---------- animation engine ---------- */
let movers = [];
let dotLayer = null;
function spawnDot(x1,y1,x2,y2,duration,color,onDone){
  if (!dotLayer) return;
  const dot = document.createElementNS(NS,'circle');
  dot.setAttribute('r', 6.5);
  dot.setAttribute('fill', color);
  dot.setAttribute('cx', x1);
  dot.setAttribute('cy', y1);
  dotLayer.appendChild(dot);
  movers.push({el:dot, x1,y1,x2,y2, start:performance.now(), duration: reduced ? 30 : duration, onDone});
}
function tick(now){
  for (let i=movers.length-1;i>=0;i--){
    const m = movers[i];
    let t = (now-m.start)/m.duration;
    if (t>1) t=1;
    const e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    m.el.setAttribute('cx', m.x1+(m.x2-m.x1)*e);
    m.el.setAttribute('cy', m.y1+(m.y2-m.y1)*e);
    if (t>=1){
      m.el.remove();
      movers.splice(i,1);
      if (m.onDone) m.onDone();
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function clearMovers(){
  movers.forEach(m=>m.el.remove());
  movers = [];
}
function pulse(idx, cls){
  const c = canvasPanel.querySelector(`.node-circle[data-idx="${idx}"]`);
  if (!c) return;
  const orig = c.getAttribute('stroke');
  c.classList.add(cls);
  setTimeout(()=>c.classList.remove(cls), 500);
}

/* ---------- tab: WHY ---------- */
function renderWhy(){
  const n = state.count1;
  const names = SERVICES8.slice(0,n);
  const nodes = names.map((name,i)=>({...pos(CX,CY,RING_R,i,n), name}));
  const isBus = state.mode1 === 'bus';
  const conns = isBus ? n : n*(n-1)/2;
  const formula = isBus ? 'N connections' : 'N·(N−1)/2 connections';

  let lines = '';
  if (isBus){
    nodes.forEach(p=>{ lines += `<line class="conn-line" x1="${CX}" y1="${CY}" x2="${p.x}" y2="${p.y}"/>`; });
  } else {
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
      lines += `<line class="conn-line" x1="${nodes[i].x}" y1="${nodes[i].y}" x2="${nodes[j].x}" y2="${nodes[j].y}"/>`;
    }
  }
  const hub = isBus ? `<circle class="hub-circle" cx="${CX}" cy="${CY}" r="${HUB_R}"/><text class="hub-label" x="${CX}" y="${CY+4}">BUS</text>` : '';
  const nodeSvg = nodes.map((p,i)=>`
    <g class="node-group">
      <circle class="node-circle" data-idx="${i}" cx="${p.x}" cy="${p.y}" r="${NODE_R}"/>
      <text class="node-label" x="${p.x}" y="${p.y+NODE_R+16}">${p.name}</text>
    </g>`).join('');

  canvasPanel.innerHTML = `
    <div class="stat-row">
      <div class="stat-num">${n}</div><div class="stat-label">services</div>
      <div class="stat-arrow">→</div>
      <div class="stat-num">${conns}</div><div class="stat-label">${formula}</div>
    </div>
    <svg viewBox="0 0 800 460" role="img" aria-label="Network diagram of ${n} services">
      <g>${lines}</g>
      ${hub}
      ${nodeSvg}
    </svg>
    <div class="controls">
      <span class="hint">Layout</span>
      <div class="seg">
        <button data-m1="p2p" class="${!isBus?'active':''}">Point-to-point</button>
        <button data-m1="bus" class="${isBus?'active':''}">With a bus</button>
      </div>
      <span class="hint" style="margin-left:6px;">Services</span>
      <button class="btn ghost" id="minusSvc" ${n<=3?'disabled':''}>− Remove</button>
      <button class="btn ghost" id="plusSvc" ${n>=8?'disabled':''}>+ Add service</button>
    </div>`;

  canvasPanel.querySelectorAll('[data-m1]').forEach(b=>b.onclick=()=>{state.mode1=b.dataset.m1; renderWhy();});
  canvasPanel.querySelector('#plusSvc').onclick = ()=>{ if(state.count1<8){state.count1++; renderWhy();} };
  canvasPanel.querySelector('#minusSvc').onclick = ()=>{ if(state.count1>3){state.count1--; renderWhy();} };

  logPanel.innerHTML = `<div class="log-empty">// this tab has no message log — flip between layouts and add services to see the connection count change</div>`;
}

/* ---------- shared 5-node ring (tabs 2 & 3) ---------- */
function ringNodes(){
  return SERVICES5.map((name,i)=>({...pos(CX,CY,RING_R,i,5), name, full:FULL5[i]}));
}
function filterLabel(f){ return f==='all' ? 'all' : (f==='high' ? 'high-value only' : 'standard only'); }
function baseSvgShell(nodes, extraDlq, opts){
  opts = opts || {};
  const noBus = opts.noBus;
  const showFilters = opts.showFilters;
  const producerIdx = opts.producerIdx!==undefined ? opts.producerIdx : -1;
  const lines = noBus
    ? nodes.map((p,i)=> i===producerIdx ? '' : `<line class="conn-line" x1="${nodes[producerIdx].x}" y1="${nodes[producerIdx].y}" x2="${p.x}" y2="${p.y}"/>`).join('')
    : nodes.map(p=>`<line class="conn-line" x1="${CX}" y1="${CY}" x2="${p.x}" y2="${p.y}"/>`).join('');
  const nodeSvg = nodes.map((p,i)=>{
    const chip = (showFilters && i!==producerIdx)
      ? `<text class="filter-chip" x="${p.x}" y="${p.y+NODE_R+30}">#${filterLabel(FILTERS[i])}</text>` : '';
    return `
    <g class="node-group">
      <circle class="node-circle" data-idx="${i}" cx="${p.x}" cy="${p.y}" r="${NODE_R}"><title>${p.full}</title></circle>
      <text class="node-label" x="${p.x}" y="${p.y+NODE_R+16}">${p.name}</text>
      ${chip}
    </g>`;
  }).join('');
  const dlqCount = state.dlqMessages.length;
  const dlq = extraDlq ? `
    <g id="dlqGroup" style="cursor:pointer;">
      <rect class="dlq-rect" x="${DLQ.x-76}" y="${DLQ.y-22}" width="152" height="44" rx="8"/>
      <text class="dlq-label" x="${DLQ.x}" y="${DLQ.y-2}">Dead-letter queue</text>
      <text class="dlq-count" id="dlqCountText" x="${DLQ.x}" y="${DLQ.y+14}">${dlqCount} message${dlqCount===1?'':'s'} · click to review</text>
    </g>` : '';
  const hub = noBus ? '' : `<circle class="hub-circle" cx="${CX}" cy="${CY}" r="${HUB_R}"/><text class="hub-label" x="${CX}" y="${CY+4}">BUS</text>`;
  const h = extraDlq ? 460 : (showFilters ? 430 : 400);
  return `<svg viewBox="0 0 800 ${h}" role="img" aria-label="Service bus diagram">
      <g>${lines}</g>
      ${hub}
      ${nodeSvg}
      <g id="dotLayer">${dlq}</g>
    </svg>`;
}

/* ---------- tab: HOW IT MOVES ---------- */
function moveHint(){
  if (state.busMode2==='nobus') return 'No bus: the sender has to know about and call every interested service itself, one at a time.';
  if (state.deliveryMode2==='queue') return 'Queue: only one consumer picks up each message — good for distributing work.';
  if (state.deliveryMode2==='broadcast') return 'Topic, no filter: every subscription gets its own copy of the message.';
  return 'Topic + filters: each subscription only receives messages whose tag matches its filter.';
}
function renderMove(){
  const nodes = ringNodes();
  const busOn = state.busMode2 === 'bus';
  const filtered = busOn && state.deliveryMode2 === 'filtered';
  const svgOpts = { noBus: !busOn, showFilters: filtered, producerIdx: state.producer };

  canvasPanel.innerHTML = `
    <div class="legend">
      <span><span class="dot" style="background:var(--cyan)"></span>message in flight / delivered</span>
    </div>
    ${baseSvgShell(nodes, false, svgOpts)}
    <div class="controls">
      <span class="hint">Compare</span>
      <div class="seg">
        <button data-bus="nobus" class="${!busOn?'active':''}">No bus</button>
        <button data-bus="bus" class="${busOn?'active':''}">With a bus</button>
      </div>
      ${busOn ? `
      <div class="seg">
        <button data-dm="queue" class="${state.deliveryMode2==='queue'?'active':''}">Queue</button>
        <button data-dm="broadcast" class="${state.deliveryMode2==='broadcast'?'active':''}">Topic – broadcast</button>
        <button data-dm="filtered" class="${state.deliveryMode2==='filtered'?'active':''}">Topic – filtered</button>
      </div>` : ''}
      ${filtered ? `
      <span class="hint" style="margin-left:6px;">Tag message</span>
      <div class="seg">
        <button data-tag="standard" class="${state.msgTag==='standard'?'active':''}">Standard</button>
        <button data-tag="high" class="${state.msgTag==='high'?'active':''}">High-value</button>
      </div>` : ''}
      <button class="btn primary" id="sendMsg" style="margin-left:auto;">Send message</button>
    </div>
    <div class="hint" style="padding-bottom:12px;">${moveHint()}</div>`;
  dotLayer = canvasPanel.querySelector('#dotLayer');

  nodes.forEach((p,i)=>{
    const c = canvasPanel.querySelector(`.node-circle[data-idx="${i}"]`);
    if (i===state.producer){ c.setAttribute('stroke','var(--cyan)'); c.setAttribute('stroke-width','2.5'); }
  });

  canvasPanel.querySelectorAll('[data-bus]').forEach(b=>b.onclick=()=>{state.busMode2=b.dataset.bus; renderMove();});
  canvasPanel.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{state.deliveryMode2=b.dataset.dm; renderMove();});
  canvasPanel.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{state.msgTag=b.dataset.tag; renderMove();});
  canvasPanel.querySelectorAll('.node-circle').forEach(c=>{
    c.onclick=()=>{ state.producer = Number(c.dataset.idx); renderMove(); };
  });
  canvasPanel.querySelector('#sendMsg').onclick = ()=>sendMove(nodes);

  clearLog();
  state.tab='move';
}
function sendMove(nodes){
  const p = nodes[state.producer];
  const others = nodes.map((n,i)=>i).filter(i=>i!==state.producer);
  const busOn = state.busMode2 === 'bus';

  if (!busOn){
    log(`No bus: <strong>${p.name}</strong> must call each interested service directly, one by one`);
    others.forEach((idx,order)=>{
      const target = nodes[idx];
      setTimeout(()=>{
        spawnDot(p.x,p.y,target.x,target.y,420,'var(--cyan)', ()=>{
          log(`${p.name} → ${target.name} <span class="log-dim">(direct call — sender must know this service exists)</span>`);
        });
      }, order*220);
    });
    return;
  }

  log(`<strong>${p.name}</strong> → bus <span class="log-dim">(${state.deliveryMode2}${state.deliveryMode2==='filtered'?', tag: '+state.msgTag:''})</span>`);
  spawnDot(p.x,p.y,CX,CY,450,'var(--cyan)', ()=>{
    if (state.deliveryMode2==='broadcast'){
      others.forEach(idx=>{
        const target = nodes[idx];
        spawnDot(CX,CY,target.x,target.y,450,'var(--cyan)', ()=>{
          log(`bus → ${target.name} <span class="log-ok">delivered</span>`);
        });
      });
    } else if (state.deliveryMode2==='queue'){
      const idx = others[state.rr % others.length];
      state.rr++;
      const target = nodes[idx];
      spawnDot(CX,CY,target.x,target.y,450,'var(--cyan)', ()=>{
        log(`bus → ${target.name} <span class="log-ok">delivered</span> <span class="log-dim">(1 of ${others.length} eligible consumers)</span>`);
      });
    } else {
      others.forEach(idx=>{
        const target = nodes[idx];
        const filter = FILTERS[idx];
        const matched = filter==='all' || filter===state.msgTag;
        if (matched){
          spawnDot(CX,CY,target.x,target.y,450,'var(--cyan)', ()=>{
            log(`bus → ${target.name} <span class="log-ok">delivered</span> <span class="log-dim">(filter: ${filterLabel(filter)})</span>`);
          });
        } else {
          log(`bus → ${target.name} <span class="log-dim">skipped — filter "${filterLabel(filter)}" doesn't match tag "${state.msgTag}"</span>`);
        }
      });
    }
  });
}

/* ---------- tab: WHEN IT FAILS ---------- */
const FAIL_PRODUCER = 1; // Orders
function renderFail(){
  if (state.dlqView){ renderDlqInspector(); return; }
  const nodes = ringNodes();
  const dlqCount = state.dlqMessages.length;
  canvasPanel.innerHTML = `
    <div class="legend">
      <span><span class="dot" style="background:var(--cyan)"></span>delivered</span>
      <span><span class="dot" style="background:var(--amber)"></span>retry attempt</span>
      <span><span class="dot" style="background:var(--red)"></span>dead-lettered</span>
    </div>
    ${baseSvgShell(nodes,true)}
    <div class="controls">
      <span class="hint">Click a service to mark it unhealthy, then send a message from Orders</span>
      <button class="btn primary" id="sendMsg2" style="margin-left:auto;">Send message</button>
      <button class="btn ghost" id="reviewDlqBtn" ${dlqCount===0?'disabled':''}>Review failed messages (${dlqCount})</button>
      <button class="btn ghost" id="resetFail">Reset</button>
    </div>`;
  dotLayer = canvasPanel.querySelector('#dotLayer');

  nodes.forEach((p,i)=>{
    const c = canvasPanel.querySelector(`.node-circle[data-idx="${i}"]`);
    if (i===FAIL_PRODUCER){ c.setAttribute('stroke','var(--cyan)'); c.setAttribute('stroke-width','2.5'); }
    if (state.unhealthy.has(i)){
      c.setAttribute('stroke','var(--red)');
      c.setAttribute('stroke-width','2.5');
      c.setAttribute('stroke-dasharray','5 4');
    }
  });

  canvasPanel.querySelectorAll('.node-circle').forEach(c=>{
    c.onclick=()=>{
      const i = Number(c.dataset.idx);
      if (i===FAIL_PRODUCER) return;
      if (state.unhealthy.has(i)) state.unhealthy.delete(i); else state.unhealthy.add(i);
      renderFail();
    };
  });
  canvasPanel.querySelector('#sendMsg2').onclick = ()=>sendFail(nodes);
  const dlqGroup = canvasPanel.querySelector('#dlqGroup');
  if (dlqGroup) dlqGroup.onclick = ()=>{ state.dlqView=true; renderFail(); };
  const reviewBtn = canvasPanel.querySelector('#reviewDlqBtn');
  if (reviewBtn) reviewBtn.onclick = ()=>{ state.dlqView=true; renderFail(); };
  canvasPanel.querySelector('#resetFail').onclick = ()=>{
    state.unhealthy.clear(); state.dlqMessages=[]; state.dlqView=false; clearLog(); renderFail();
  };
  clearLog();
}

function renderDlqInspector(){
  const msgs = state.dlqMessages;
  const rows = msgs.length ? msgs.map(m=>`
    <div class="dlq-row">
      <div class="dlq-row-main">
        <div class="dlq-row-title">${m.name} <span class="log-time">${m.time}</span></div>
        <div class="dlq-row-reason">${m.reason}${state.unhealthy.has(m.idx) ? ' <span class="log-warn">· still unhealthy</span>' : ' <span class="log-ok">· now healthy</span>'}</div>
      </div>
      <div class="dlq-row-actions">
        <button class="btn ghost small" data-action="retry" data-id="${m.id}">Retry now</button>
        <button class="btn ghost small" data-action="discard" data-id="${m.id}">Discard</button>
      </div>
    </div>`).join('') : `<div class="log-empty" style="padding:34px 0;text-align:center;">No dead-lettered messages right now.</div>`;

  canvasPanel.innerHTML = `
    <div class="dlq-header">
      <button class="btn ghost" id="backToDiagram">← Back to diagram</button>
      <span class="dlq-title">Dead-letter queue inspector — ${msgs.length} message${msgs.length===1?'':'s'}</span>
    </div>
    <div class="dlq-list">${rows}</div>
    ${msgs.length ? `<div class="controls">
       <button class="btn ghost" id="retryAll">Retry all</button>
       <button class="btn ghost" id="discardAll">Discard all</button>
    </div>` : ''}`;

  canvasPanel.querySelector('#backToDiagram').onclick = ()=>{ state.dlqView=false; renderFail(); };
  canvasPanel.querySelectorAll('[data-action]').forEach(b=>{
    b.onclick = ()=>handleDlqAction(Number(b.dataset.id), b.dataset.action);
  });
  const retryAllBtn = canvasPanel.querySelector('#retryAll');
  if (retryAllBtn) retryAllBtn.onclick = ()=>{ [...state.dlqMessages].forEach(m=>handleDlqAction(m.id,'retry')); };
  const discardAllBtn = canvasPanel.querySelector('#discardAll');
  if (discardAllBtn) discardAllBtn.onclick = ()=>{
    if (state.dlqMessages.length) log(`${state.dlqMessages.length} dead-lettered message(s) <span class="log-dim">discarded by operator</span>`);
    state.dlqMessages=[]; renderDlqInspector();
  };
}
function handleDlqAction(id, action){
  const idx = state.dlqMessages.findIndex(m=>m.id===id);
  if (idx===-1) return;
  const m = state.dlqMessages[idx];
  if (action==='discard'){
    state.dlqMessages.splice(idx,1);
    log(`${m.name}: dead-lettered message <span class="log-dim">discarded by operator</span>`);
  } else {
    if (state.unhealthy.has(m.idx)){
      log(`${m.name}: retry attempted — <span class="log-warn">still unavailable</span>, remains in dead-letter queue`);
    } else {
      state.dlqMessages.splice(idx,1);
      log(`${m.name}: <span class="log-ok">redelivered successfully</span> — message resolved`);
    }
  }
  renderDlqInspector();
}
function sendFail(nodes){
  const p = nodes[FAIL_PRODUCER];
  const others = nodes.map((n,i)=>i).filter(i=>i!==FAIL_PRODUCER);
  log(`<strong>${p.name}</strong> → bus <span class="log-dim">(topic, fan-out to ${others.length})</span>`);
  spawnDot(p.x,p.y,CX,CY,450,'var(--cyan)', ()=>{
    others.forEach(i=>{
      const target = nodes[i];
      if (state.unhealthy.has(i)){
        retryChain(target, i, 1);
      } else {
        spawnDot(CX,CY,target.x,target.y,450,'var(--cyan)', ()=>{
          log(`bus → ${target.name} <span class="log-ok">delivered</span>`);
        });
      }
    });
  });
}
function retryChain(target, idx, attempt){
  spawnDot(CX,CY,target.x,target.y,380,'var(--amber)', ()=>{
    log(`bus → ${target.name} delivery attempt ${attempt}/3 <span class="log-warn">failed</span>`);
    pulse(idx,'flash-warn');
    if (attempt<3){
      setTimeout(()=>retryChain(target, idx, attempt+1), 260);
    } else {
      setTimeout(()=>{
        spawnDot(CX,CY,DLQ.x,DLQ.y,480,'var(--red)', ()=>{
          log(`${target.name}: max delivery count exceeded → moved to <span class="log-err">dead-letter queue</span>`);
          state.dlqMessages.push({id:++dlqIdCounter, idx, name:target.name, time:fmtTime(), reason:'Consumer unavailable after 3 delivery attempts'});
          const n = state.dlqMessages.length;
          const el = canvasPanel.querySelector('#dlqCountText');
          if (el) el.textContent = `${n} message${n===1?'':'s'} · click to review`;
          const btn = canvasPanel.querySelector('#reviewDlqBtn');
          if (btn){ btn.textContent = `Review failed messages (${n})`; btn.disabled = n===0; }
        });
      },260);
    }
  });
}

  canvasPanel.innerHTML = `
    <div class="azure-grid">
      <div class="azure-card">
        <div class="from">This demo: Queue</div>
        <div class="to">Azure Service Bus Queue</div>
        <p>First-in-first-out delivery, competing consumers — each message is processed by exactly one receiver, even with many instances reading the same queue.</p>
      </div>
      <div class="azure-card">

        <div class="to">Topics &amp; Subscriptions</div>

      </div>
      <div class="azure-card">
        <div class="from">This demo: Retry → DLQ</div>
        <div class="to">Max Delivery Count &amp; Dead-letter Queue</div>

      </div>
      <div class="azure-card">

/* ---------- tab switching ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    clearMovers();
    const t = btn.dataset.tab;
    state.tab = t;
    if (t==='why') renderWhy();
    else if (t==='move') renderMove();
    else if (t==='fail') renderFail();
    else if (t==='azure') renderAzure();
  });
});

renderWhy();
